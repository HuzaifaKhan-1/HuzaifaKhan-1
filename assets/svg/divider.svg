<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="img" aria-label="Section divider" fill="none"><title>Section divider</title><style>.run{animation:run 7s cubic-bezier(.45,0,.25,1) infinite}@keyframes run{0%{transform:translateX(-260px);opacity:0}10%{opacity:1}80%{opacity:1}92%{transform:translateX(1200px);opacity:0}100%{transform:translateX(1200px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#06B6D4"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".15" stop-color="#fff" stop-opacity="1"/><stop offset=".85" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1200" height="12" fill="url(#fade)"/></mask><linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#06B6D4" stop-opacity="0"/><stop offset=".75" stop-color="#A5F3FC" stop-opacity=".9"/><stop offset="1" stop-color="#fff"/></linearGradient><filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter></defs><g mask="url(#m)"><rect x="0" y="5.25" width="1200" height="1.5" rx=".75" fill="url(#g)" opacity=".55"/><g class="run" transform="translate(470 0)"><rect x="0" y="4" width="260" height="4" rx="2" fill="url(#spark)" filter="url(#glow)"/><rect x="60" y="5.25" width="200" height="1.5" rx=".75" fill="url(#spark)"/></g></g></svg>