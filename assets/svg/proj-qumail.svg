<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" role="img" aria-label="QuMail: an envelope sealed by a qubit lock" fill="none"><title>QuMail: an envelope sealed by a qubit lock</title><style>.bit{animation:bit 2.4s linear infinite}@keyframes bit{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(170px);opacity:0}}.flap{animation:flap 8s ease-in-out infinite;transform-origin:240px 30px}@keyframes flap{0%{transform:scaleY(-1)}35%{transform:scaleY(-1)}45%{transform:scaleY(1)}92%{transform:scaleY(1)}100%{transform:scaleY(-1)}}.lock{animation:lock 8s cubic-bezier(.3,1.6,.5,1) infinite}@keyframes lock{0%{opacity:0;transform:translateY(-12px)}45%{opacity:0;transform:translateY(-12px)}52%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}98%{opacity:0}100%{opacity:0;transform:translateY(-12px)}}.halo{animation:halo 8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{opacity:0;transform:scale(.5)}52%{opacity:0;transform:scale(.5)}54%{opacity:.9;transform:scale(1)}66%{opacity:0;transform:scale(2.4)}100%{opacity:0}}.orb{animation:orb 2.4s linear infinite;transform-origin:0 0}@keyframes orb{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#06B6D4"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><clipPath id="c"><rect width="480" height="96" rx="12"/></clipPath><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="480" height="96" rx="12" fill="#0B1020"/><g clip-path="url(#c)"><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#67E8F9" opacity=".8"><text class="bit" x="20" y="22" style="animation-delay: